version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: depression-nlp-api
    ports:
      - "8000:8000"
    volumes:
      - ./models/saved:/app/models/saved
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
      - MODEL__MODEL_TYPE=traditional
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000
    restart: unless-stopped
    profiles:
      - tracking
