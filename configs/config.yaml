app:
  name: "Depression NLP Detector"
  version: "0.1.0"
  debug: false
  log_level: "INFO"
  log_file: "logs/app.log"

data:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  max_text_length: 512
  min_text_length: 10
  test_size: 0.2
  val_size: 0.1
  random_seed: 42
  target_column: "label"
  text_column: "text"
  # 0 = non-depressed, 1 = depressed
  positive_class: 1

model:
  model_type: "traditional"  # 'traditional' | 'bert' | 'ensemble'

  traditional:
    classifier: "logistic_regression"  # 'logistic_regression' | 'svm' | 'random_forest' | 'gradient_boosting'
    tfidf_max_features: 50000
    tfidf_ngram_range: [1, 3]
    tfidf_sublinear_tf: true
    use_char_ngrams: true
    char_ngram_range: [3, 5]
    use_psychological_features: true
    class_weight: "balanced"

  bert:
    model_name: "bert-base-uncased"
    max_length: 128
    batch_size: 16
    epochs: 3
    learning_rate: 2.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    dropout: 0.3
    gradient_clipping: 1.0

  model_dir: "models/saved"

training:
  n_folds: 5
  scoring_metric: "f1"
  n_jobs: -1
  verbose: 1
  use_smote: true
  early_stopping_patience: 3

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1
  log_level: "info"
  max_text_length: 2000
  rate_limit_per_minute: 60

evaluation:
  threshold: 0.5
  report_dir: "reports"
  plot_dir: "reports/plots"
